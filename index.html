<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C-Tests – Italiano</title>
  <style>
    body {
      max-width: 850px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: Arial, sans-serif;
      line-height: 2;
      font-size: 1.1rem;
    }

    .seite {
      display: none;
    }

    .seite.aktiv {
      display: block;
    }

    input[type="text"] {
      padding: 0.4rem;
      font: inherit;
    }

    .blank {
      box-sizing: border-box;
      width: 1.2em;
      height: 1.5em;
      margin: 0 0.08em;
      padding: 0;
      border: none;
      border-bottom: 1px solid #222;
      border-radius: 0;
      background: transparent;
      font: inherit;
      text-align: center;
      vertical-align: baseline;
    }

    .blank:focus {
      outline: none;
      border-bottom: 2px solid #1769aa;
    }

    button {
      margin: 0.5rem 0.4rem 0.5rem 0;
      padding: 0.6rem 1rem;
      font: inherit;
      cursor: pointer;
    }

    #meldung,
    #startmeldung {
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <section id="startseite" class="seite aktiv">
    <h1>Italienisch: C-Tests</h1>
    <p>Gib deinen Identifizierungscode ein, um die Tests zu starten.</p>

    <form id="startformular">
      <label for="code">Identifizierungscode:</label><br>
      <input type="text" id="code" required autocomplete="off">
      <button type="submit">Weiter</button>
    </form>

    <p id="startmeldung" aria-live="polite"></p>
  </section>

  <section id="auswahlseite" class="seite">
    <h1>Test auswählen</h1>
    <p id="begrussung"></p>

    <div id="testauswahl"></div>

    <button type="button" id="codewechsel">Anderen Code eingeben</button>
  </section>

  <main id="testseite" class="seite">
    <h1 id="testtitel"></h1>
    <p>Ergänze die fehlenden Buchstaben. Jede Linie steht für einen Buchstaben.</p>

    <p id="testtext"></p>

    <button type="button" id="speichern">Eingaben speichern</button>
    <button type="button" id="pruefen">Antworten prüfen</button>
    <button type="button" id="loeschen">Eingaben löschen</button>
    <button type="button" id="zurueck">Zur Testauswahl</button>

    <p id="meldung" aria-live="polite"></p>
  </main>

  <script>
    const tests = [
      {
        titel: "Test 1 – Le vacanze di Maria",
        testo:
          "Maria parla delle sue vacanze. È stata in Sicilia con la sua famiglia, in un campeggio vicino a una città che si chiama Siracusa. Il mare era molto bello e Maria e sua sorella Cristina hanno fatto tanti bagni. Maria sa fare anche il surf. Con la famiglia hanno visitato la cattedrale di Siracusa. Nel campeggio c’era una festa. Maria e Cristina hanno giocato a ping pong per tutta la notte."
      },
      {
        titel: "Test 2 – La mia camera",
        testo:
          "La mia camera è molto grande. Il letto è vicino all finestra. Sopra il tavolo ci sono una lampada e il vecchio orologio di mia mamma. Sotto l’armadio ci sono le mie scarpe e i miei calzini. Sul divano c’è una fotografia di mio fratello. Le tende sono rosse. Dietro la sedia vedo le scarpe da ginastica. Non trovo mai il mio astuccio. È un problema perché lì dentro ci sono la mia gomma, il righello e le matite. “Guarda sotto lo specchio”, dice mia mamma. “No, non c’è, lì non c’è”, dico io."
      },
      {
        titel: "Test 3 – Una studentessa nuova",
        testo:
          "Oggi è il primo giorno di scuola. È arrivata una studentessa nuova. Si chiama Laura. “Ciao Laura, benvenuta”, dice la signora Rinaldi, la professoressa di italiano, “ti puoi presentare?”. “Buongiorno”, dice Laura, “il mio cognome è Müller, sono tedesca, sono di Monaco, ma adesso abito a Coira. Parlo perfettamente anche lo spagnolo perché mia mamma è nata a Barcellona. Mio padre è infermiere, mia madre è direttrice. Amo la geografia. Che bello essere in questa classe!”"
      },
      {
        titel: "Test 4 – Gli animali di Luca",
        testo:
          "Mi chiamo Luca e ho tanti animali. Abito in una fattoria. Ho una mucca, una pecora, una rana e un coniglio. Il mio animale preferito però è un altro. Indovina qual è l’animale che mi piace di più. Vive in Africa e ha quattro zampe. L’elefante? No, non è grigio, è marrone e mangia altri animali. Il leone? Bravo!"
      }
    ];

    let codiceCorrente = "";
    let testCorrente = null;
    let campiRisposta = [];

    const startseite = document.getElementById("startseite");
    const auswahlseite = document.getElementById("auswahlseite");
    const testseite = document.getElementById("testseite");

    function zeigeSeite(seite) {
      [startseite, auswahlseite, testseite].forEach(elemento => {
        elemento.classList.remove("aktiv");
      });
      seite.classList.add("aktiv");
    }

    function schluesselFuerTest(testIndex) {
      return `ctest-${testIndex}-${encodeURIComponent(codiceCorrente)}`;
    }

    function ladeTest(testIndex) {
      testCorrente = testIndex;
      const test = tests[testIndex];

      document.getElementById("testtitel").textContent = test.titel;
      document.getElementById("meldung").textContent = "";

      // Teilt den Text in Sätze. Der erste und letzte Satz bleiben unverändert.
      const saetze = test.testo.match(/[^.!?]+[.!?]+["”]?/gu) || [test.testo];
      let wortNummer = 0;
      let lueckenNummer = 0;

      const mittlereSaetze = saetze.slice(1, -1).map(satz =>
        satz.replace(/[\p{L}]+(?:[’'][\p{L}]+)*/gu, wort => {
          wortNummer++;

          if (wortNummer % 2 !== 0) {
            return wort;
          }

          const fehlendeAnzahl = Math.floor(wort.length / 2);
          const sichtbarerTeil = wort.slice(0, wort.length - fehlendeAnzahl);
          const fehlendeBuchstaben = wort.slice(wort.length - fehlendeAnzahl);

          const felder = [...fehlendeBuchstaben].map(buchstabe => {
            const index = lueckenNummer++;
            return `<input
              class="blank"
              type="text"
              maxlength="1"
              aria-label="Fehlender Buchstabe ${index + 1}"
              data-answer="${buchstabe.toLocaleLowerCase("it")}"
              data-index="${index}">`;
          }).join("");

          return sichtbarerTeil + felder;
        })
      );

      const mittlererText = mittlereSaetze.join(" ");
      const ersterSatz = saetze[0] || "";
      const letzterSatz = saetze.length > 1 ? saetze[saetze.length - 1] : "";

      document.getElementById("testtext").innerHTML =
        `${ersterSatz} ${mittlererText} ${letzterSatz}`;

      campiRisposta = [...document.querySelectorAll("#testtext .blank")];
      gespeicherteEingabenLaden();
      zeigeSeite(testseite);
    }

    function gespeicherteEingabenLaden() {
      try {
        const daten = JSON.parse(
          localStorage.getItem(schluesselFuerTest(testCorrente)) || "[]"
        );

        campiRisposta.forEach((feld, index) => {
          feld.value = daten[index] || "";
          feld.style.backgroundColor = "";
        });
      } catch {
        document.getElementById("meldung").textContent =
          "Gespeicherte Eingaben konnten nicht geladen werden.";
      }
    }

    document.getElementById("startformular").addEventListener("submit", event => {
      event.preventDefault();

      codiceCorrente = document.getElementById("code").value.trim();

      if (!codiceCorrente) {
        document.getElementById("startmeldung").textContent =
          "Bitte gib einen Identifizierungscode ein.";
        return;
      }

      document.getElementById("begrussung").textContent =
        `Code: ${codiceCorrente}`;

      const auswahl = document.getElementById("testauswahl");
      auswahl.replaceChildren();

      tests.forEach((test, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = test.titel;
        button.addEventListener("click", () => ladeTest(index));
        auswahl.appendChild(button);
      });

      zeigeSeite(auswahlseite);
    });

    document.getElementById("speichern").addEventListener("click", () => {
      const daten = campiRisposta.map(feld => feld.value);
      localStorage.setItem(schluesselFuerTest(testCorrente), JSON.stringify(daten));

      document.getElementById("meldung").textContent =
        "Deine Eingaben wurden für diesen Code und Test in diesem Browser gespeichert.";
    });

    document.getElementById("pruefen").addEventListener("click", () => {
      let richtig = 0;

      campiRisposta.forEach(feld => {
        const istRichtig =
          feld.value.trim().toLocaleLowerCase("it") === feld.dataset.answer;

        feld.style.backgroundColor = feld.value
          ? (istRichtig ? "#d8f3dc" : "#ffe0e0")
          : "";

        if (istRichtig) richtig++;
      });

      document.getElementById("meldung").textContent =
        `Richtig: ${richtig} von ${campiRisposta.length} Buchstaben.`;
    });

    document.getElementById("loeschen").addEventListener("click", () => {
      campiRisposta.forEach(feld => {
        feld.value = "";
        feld.style.backgroundColor = "";
      });

      localStorage.removeItem(schluesselFuerTest(testCorrente));
      document.getElementById("meldung").textContent =
        "Eingaben für diesen Code und Test wurden gelöscht.";
    });

    document.getElementById("zurueck").addEventListener("click", () => {
      zeigeSeite(auswahlseite);
    });

    document.getElementById("codewechsel").addEventListener("click", () => {
      document.getElementById("code").value = "";
      document.getElementById("startmeldung").textContent = "";
      zeigeSeite(startseite);
    });
  </script>
</body>
</html>
